name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hookscope
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: hookscope
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hookscope" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hookscope:test-only@localhost:5432/hookscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run migrate -w backend
      - run: npm run smoke -w backend
      - run: npm run smoke:filters -w backend
