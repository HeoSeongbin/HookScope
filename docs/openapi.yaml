openapi: 3.1.0
info:
  title: HookScope Phase 7 API
  version: 0.7.0
  description: Bootstrap administrator and provisioned member keys; owner-scoped captures, Replay, Analytics, retention and metadata audit. Unknown or foreign resource IDs return 404. Full policies and deployment limits are documented in PROJECT.md and docs/SECURITY.md.
servers:
  - url: http://localhost:8088
security:
  - AdminKey: []
paths:
  /api/v1/auth/me:
    get:
      summary: Identify the currently authenticated administrator or member
      responses:
        '200': {description: 'id, name, role (ADMIN or MEMBER)'}
        '401': {description: 'Missing, expired, disabled or revoked management key'}
  /api/v1/users:
    get:
      summary: Administrator-only list of up to 100 most recent accounts; never includes key hashes
      responses:
        '200': {description: Object containing items array of ManagementUser}
        '403': {description: ADMIN_REQUIRED}
    post:
      summary: Administrator-only provision of a member key; returned once and expires after 30 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Created account and one-time key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedUserKey'}
        '400': {description: Invalid name or privilege-changing fields}
        '403': {description: ADMIN_REQUIRED}
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Administrator-only account enable or disable; disabling also blocks owned endpoint intake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: ManagementUser metadata; no key}
        '403': {description: ADMIN_REQUIRED}
        '404': {description: Account not found}
        '409': {description: Bootstrap account is protected}
  /api/v1/users/{id}/rotate-key:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Administrator-only key replacement; immediately revokes old key and sockets; does not enable disabled accounts
      responses:
        '200':
          description: Replacement key with a new 30-day expiry; displayed once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedUserKey'}
        '403': {description: ADMIN_REQUIRED}
        '404': {description: Account not found}
        '409': {description: Bootstrap key is managed through environment configuration}
  /api/v1/endpoints/{id}/policy:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Replace owner-authorized endpoint expiry, retention and quota policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointPolicy'}
      responses:
        '200': {description: Updated endpoint including ownerId and policy}
        '400': {description: Invalid policy or unknown fields}
        '404': {description: Endpoint not found or not owned}
  /api/v1/endpoints/{id}/rotate-token:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Replace public receive token; previously authorized in-flight requests may still finish
      responses:
        '200': {description: Updated endpoint with the new publicToken}
        '404': {description: Endpoint not found or not owned}
  /api/v1/endpoints/{id}/cleanup:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Run a bounded retention batch for one owned endpoint; Replay references stay pinned
      responses:
        '200': {description: 'deletedRequests count and busy boolean; busy means another sweep holds the advisory lock'}
        '404': {description: Endpoint not found or not owned}
  /api/v1/audit:
    get:
      summary: Same-snapshot 30-row metadata audit page; members see their owned data only
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - name: endpointId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Audit page; never includes request/response bodies, hashes, keys or public tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    maxItems: 30
                    items: {$ref: '#/components/schemas/AuditLog'}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer, const: 30}
        '400': {description: Invalid or duplicate/unknown query key}
        '401': {description: Unauthorized}
  /api/v1/dashboard/summary:
    get:
      summary: Aggregate all endpoints accessible to the authenticated principal; members are restricted to their own
      description: Read-only PostgreSQL snapshot. Includes EXTERNAL/TEST/REPLAY. No body, headers, query or public token returned. Unknown/duplicate query keys are rejected.
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200':
          description: Metadata-only snapshot statistics; historical totals are distinct from window totals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analytics'}
        '400': {description: Invalid period or query; at most 31 days}
        '401': {description: Unauthorized}
        '429': {description: Management rate limit exceeded}
        '503': {description: Storage unavailable; never replaced by zero statistics}
  /api/v1/endpoints/{id}/statistics:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Aggregate one authorized endpoint
      description: Same contract as dashboard summary, with every count and replay attempt restricted to this endpoint. Unknown/duplicate query keys are rejected.
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200':
          description: Endpoint statistics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analytics'}
        '400': {description: 'Invalid UUID, period or query'}
        '401': {description: Unauthorized}
        '404': {description: Endpoint not found}
        '429': {description: Management rate limit exceeded}
        '503': {description: Storage unavailable}
  /api/v1/requests/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Create or return an idempotent replay to the original active endpoint
      description: No destination URL accepted. 20 calls per minute per management IP. Redis failure retains PostgreSQL PENDING and returns enqueuePending true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey]
              properties:
                idempotencyKey: {type: string, format: uuid}
                maxAttempts: {type: integer, minimum: 1, maximum: 3, default: 3}
      responses:
        '202':
          description: Persisted job; acceptance does not guarantee delivery
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReplayJob'
                  - type: object
                    properties:
                      enqueuePending: {type: boolean}
        '400': {description: Invalid input or unsupported original payload}
        '401': {description: Unauthorized}
        '404': {description: Original request not found}
        '409': {description: Disabled endpoint or idempotency key conflict}
        '429': {description: Management rate limit or REPLAY_JOB_QUOTA; at most 1000 retained jobs per endpoint}
  /api/v1/endpoints/{id}/replays:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: List endpoint replay jobs with same-snapshot total
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ReplayStatus'}
      responses:
        '200': {description: 'items, total, page, pageSize (30); ordered by createdAt and UUID descending'}
        '400': {description: Invalid or unknown query key}
        '401': {description: Unauthorized}
        '404': {description: Endpoint not found}
  /api/v1/replays/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Read a replay job
      responses:
        '200':
          description: PostgreSQL job state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplayJob'}
        '401': {description: Unauthorized}
        '404': {description: Replay not found}
  /api/v1/replays/{id}/attempts:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Read up to three attempts in ascending attempt number
      responses:
        '200':
          description: Actual observed HTTP results; distinct from capture planned response snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    maxItems: 3
                    items: {$ref: '#/components/schemas/ReplayAttempt'}
        '401': {description: Unauthorized}
        '404': {description: Replay not found}
  /api/v1/replays/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Cancel PENDING, QUEUED or RETRYING; repeat CANCELLED is idempotent
      responses:
        '200': {description: Cancelled job}
        '401': {description: Unauthorized}
        '404': {description: Replay not found}
        '409': {description: Running or terminal job cannot be cancelled}
  /api/v1/endpoints:
    get:
      summary: List endpoints
      responses:
        '200': {description: 'Object containing items array'}
        '401': {description: Unauthorized}
    post:
      summary: Create endpoint owned by the authenticated principal; 20 per member or 1000 for bootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201': {description: 'Endpoint with id, name, publicToken, enabled, createdAt'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
  /api/v1/endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Delete an owned endpoint and its captures/config/terminal Replay graph; retain audit metadata
      responses:
        '200': {description: Object containing deletedRequests count}
        '404': {description: Endpoint not found or not owned}
        '409': {description: REPLAY_IN_PROGRESS; cancel or wait first}
    get:
      summary: Get endpoint
      responses:
        '200': {description: Endpoint}
        '404': {description: Not found}
  /api/v1/endpoints/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Clear captures and terminal Replay jobs/attempts in one transaction
      responses:
        '200': {description: Object containing deletedRequests count}
        '404': {description: Endpoint not found or not owned}
        '409': {description: REPLAY_IN_PROGRESS; no partial deletion}
    get:
      summary: List captures with server-side filters and same-snapshot total
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
        - name: method
          in: query
          schema: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        - name: status
          in: query
          schema: {type: integer, minimum: 100, maximum: 599}
        - name: contentType
          in: query
          description: Case-insensitive MIME type without charset or boundary parameters
          schema: {type: string, maxLength: 120, example: application/json}
        - name: from
          in: query
          description: Inclusive received-at lower bound; explicit UTC/offset required
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Inclusive received-at upper bound; must not precede from
          schema: {type: string, format: date-time}
        - name: q
          in: query
          description: Literal case-insensitive substring in ID, parsed body, masked headers, query and content type; excludes raw Base64 and unparsed bodies
          schema: {type: string, maxLength: 200}
        - name: sort
          in: query
          schema: {type: string, enum: [newest, oldest], default: newest}
      responses:
        '200': {description: 'items, total, page, pageSize (30)'}
        '400': {description: 'Invalid, repeated or unknown query parameter'}
        '401': {description: Unauthorized}
        '404': {description: Endpoint not found}
  /api/v1/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Inspect stored request
      responses:
        '200': {description: 'Capture including masked header pairs, duplicate query arrays, parsedBody, parseError, rawBody (Base64), rawEncoding'}
        '404': {description: Not found}
  /api/v1/endpoints/{id}/response:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get endpoint response config; defaults apply if no row exists
      responses:
        '200':
          description: Current response config
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResponseConfig'}
        '401': {description: Unauthorized}
        '404': {description: Endpoint not found}
    put:
      summary: Atomically save config for future captures; existing snapshots remain unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResponseConfig'}
      responses:
        '200': {description: Saved response config}
        '400': {description: Invalid config or unsafe headers}
        '401': {description: Unauthorized}
        '404': {description: Endpoint not found}
        '413': {description: Management JSON exceeds 16 KiB}
  /api/v1/endpoints/{id}/test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Send actual HTTP to own loopback endpoint; user URLs and redirects are unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestInput'}
      responses:
        '200':
          description: Attempt result, not business success; recorded confirms DB visibility at result time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestResult'}
        '400': {description: Invalid input including user URL or forbidden headers}
        '401': {description: Unauthorized}
        '404': {description: Endpoint not found}
        '409': {description: Endpoint disabled}
        '413': {description: Management JSON exceeds 16 KiB}
        '429': {description: 20 attempts per minute per management IP or 8 concurrent attempts exceeded}
        '503': {description: Test service or storage unavailable}
  /h/{publicToken}:
    parameters:
      - name: publicToken
        in: path
        required: true
        schema: {type: string}
    post: &ingestion
      security: []
      summary: Record a webhook (max 256 KiB, compression unsupported)
      responses:
        '200': {description: Default receipt or configured custom response; custom mode may return any status 200-599}
        '404': {description: 'Unknown, disabled, expired endpoint or disabled owner'}
        '413': {description: Body too large}
        '415': {description: Unsupported content encoding}
        '429': {description: IP/endpoint rate or request/body storage quota exceeded; capture not stored}
        '503': {description: Storage unavailable}
    get: *ingestion
    put: *ingestion
    patch: *ingestion
    delete: *ingestion
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Process alive}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: Request table reachable}
        '503': {description: Database not ready}
components:
  schemas:
    ManagementUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string, enum: [ADMIN, MEMBER]}
        enabled: {type: boolean}
        keyExpiresAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    IssuedUserKey:
      allOf:
        - $ref: '#/components/schemas/ManagementUser'
        - type: object
          properties:
            key: {type: string, format: password, description: 'hsu_ plus 256 random bits; returned once, stored as SHA-256 only'}
    EndpointPolicy:
      type: object
      additionalProperties: false
      required: [enabled, expiresAt, retentionDays, rateLimitPerMinute, maxRequests, maxBodyStorageBytes]
      properties:
        enabled: {type: boolean}
        expiresAt: {type: [string, 'null'], format: date-time, description: Explicit timezone; null means no receive expiry}
        retentionDays: {type: [integer, 'null'], minimum: 1, maximum: 365, description: 'Null for manual retention; new default 7, legacy null preserved'}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 1200, default: 120}
        maxRequests: {type: integer, minimum: 1, maximum: 100000, default: 10000}
        maxBodyStorageBytes: {type: integer, minimum: 1, maximum: 1073741824, default: 67108864, description: Sum of retained raw body bytes; not total database disk usage}
    AuditLog:
      type: object
      properties:
        id: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        ownerId: {type: string, format: uuid}
        action: {type: string}
        targetId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        details:
          type: object
          description: Allowlisted metadata; may be empty depending on action
          additionalProperties: false
          properties:
            requests: {type: integer}
            mode: {type: string, enum: [DEFAULT, CUSTOM]}
            status: {type: integer}
            delayMs: {type: integer}
            replayId: {type: string, format: uuid}
            maxAttempts: {type: integer}
            enabled: {type: boolean}
            expiresAt: {type: [string, 'null'], format: date-time}
            retentionDays: {type: [integer, 'null']}
            rateLimitPerMinute: {type: integer}
            maxRequests: {type: integer}
            maxBodyStorageBytes: {type: integer}
    Analytics:
      type: object
      description: Same-snapshot statistics; planned HTTP status is not business success or actual client receipt
      properties:
        endpointId: {type: [string, 'null'], format: uuid, description: Null for global dashboard}
        asOf: {type: string, format: date-time, description: PostgreSQL transaction start timestamp}
        range:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            bucket: {type: string, const: hour}
            timezone: {type: string, const: UTC}
        endpointCount: {type: integer, description: 'All accessible endpoints in this scope, not filtered by period'}
        allTimeRequests: {type: integer, description: 'All retained captures in this scope, not filtered by period'}
        totals:
          type: object
          properties:
            requests: {type: integer}
            recentHourRequests: {type: integer, description: Intersection of selected window and the hour before to}
            plannedErrorResponses: {type: integer, description: Planned status at least 400; may overlap parseErrors}
            parseErrors: {type: integer}
            bodyBytes: {type: integer}
            capturePreparationAvgMs: {type: [number, 'null'], description: 'Before DB storage, not total HTTP latency'}
            capturePreparationP95Ms: {type: [number, 'null'], description: Continuous 95th percentile; null without samples}
        methods:
          type: array
          items:
            type: object
            properties:
              method: {type: string}
              count: {type: integer}
        statuses:
          type: array
          items:
            type: object
            properties:
              status: {type: integer, description: Planned response status}
              count: {type: integer}
        sources:
          type: array
          items:
            type: object
            properties:
              source: {type: string, enum: [EXTERNAL, TEST, REPLAY]}
              count: {type: integer}
        timeline:
          type: array
          maxItems: 745
          description: UTC hour starts, ascending; zero filled empty buckets with partial boundary hours clipped to the requested period
          items:
            type: object
            properties:
              hour: {type: string, format: date-time}
              count: {type: integer}
        endpointUsage:
          type: array
          maxItems: 10
          description: Top ten by window count descending, then UUID; percentages use all window requests as denominator
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              count: {type: integer}
        recentRequests:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/AnalyticsCapture'}
        recentErrors:
          type: array
          maxItems: 5
          description: Planned status at least 400 or parse error; ordered by receivedAt and UUID descending
          items: {$ref: '#/components/schemas/AnalyticsCapture'}
        replay:
          type: object
          description: Attempts with startedAt in the selected period; independent of capture receivedAt
          properties:
            attempts: {type: integer}
            timedAttempts: {type: integer, description: Attempts with non-null durationMs}
            avgDurationMs: {type: [number, 'null'], description: Actual Worker HTTP elapsed time for measured attempts}
            p95DurationMs: {type: [number, 'null']}
            statuses:
              type: array
              items:
                type: object
                properties:
                  status: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]}
                  count: {type: integer}
    AnalyticsCapture:
      type: object
      properties:
        id: {type: string, format: uuid}
        endpointId: {type: string, format: uuid}
        method: {type: string}
        receivedAt: {type: string, format: date-time}
        responseStatus: {type: integer}
        source: {type: string, enum: [EXTERNAL, TEST, REPLAY]}
        parseError: {type: boolean, description: Whether parsing failed; no raw parser message returned}
    ReplayStatus:
      type: string
      enum: [PENDING, QUEUED, RUNNING, RETRYING, SUCCEEDED, FAILED, CANCELLED, UNKNOWN]
    ReplayJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        endpointId: {type: string, format: uuid}
        originalRequestId: {type: string, format: uuid}
        idempotencyKey: {type: string, format: uuid}
        maxAttempts: {type: integer, minimum: 1, maximum: 3}
        status: {$ref: '#/components/schemas/ReplayStatus'}
        queueName: {type: string}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        lastError: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReplayAttempt:
      type: object
      properties:
        id: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        number: {type: integer, minimum: 1, maximum: 3}
        requestId: {type: string, format: uuid, description: Reserved ID; link only when captured is true}
        captured: {type: boolean}
        status: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]}
        responseStatus: {type: [integer, 'null']}
        responseBody: {type: [string, 'null']}
        responseHeaders:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Pair'}
        durationMs: {type: [integer, 'null']}
        errorCode: {type: [string, 'null']}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    Pair:
      type: array
      minItems: 2
      maxItems: 2
      items: {type: string}
    ResponseConfig:
      type: object
      additionalProperties: false
      properties:
        mode: {type: string, enum: [DEFAULT, CUSTOM], default: DEFAULT}
        status: {type: integer, minimum: 200, maximum: 599, default: 200}
        contentType: {type: string, enum: [application/json, text/plain], default: application/json}
        body:
          type: string
          description: UTF-8 maximum 8192 bytes; empty for CUSTOM status 204/205/304; JSON syntax intentionally unrestricted
          default: ''
        headers:
          type: array
          maxItems: 12
          description: Unique case-insensitive X-Test-/X-Mock-/X-Custom- names; ASCII values up to 512 chars; CRLF forbidden
          items: {$ref: '#/components/schemas/Pair'}
          default: []
        delayMs: {type: integer, minimum: 0, maximum: 2000, default: 0}
    TestInput:
      type: object
      additionalProperties: false
      properties:
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE], default: POST}
        contentType: {type: string, enum: [application/json, text/plain, application/x-www-form-urlencoded], default: application/json}
        body: {type: string, description: UTF-8 maximum 8192 bytes; GET requires empty body, default: ''}
        headers:
          type: array
          maxItems: 12
          description: Safe X-Test-/X-Mock-/X-Custom- names plus Accept/User-Agent; no Authorization/Cookie/Host or internal token
          items: {$ref: '#/components/schemas/Pair'}
          default: []
        query:
          type: array
          maxItems: 20
          description: Duplicate key pairs; key 1-80 chars, value up to 512 chars, encoded query up to 4096 bytes
          items: {$ref: '#/components/schemas/Pair'}
          default: []
    TestResult:
      type: object
      properties:
        outcome: {type: string, enum: [RESPONSE, TIMEOUT, FAILED]}
        recorded: {type: boolean}
        requestId: {type: [string, 'null'], description: Confirmed stored request ID only}
        durationMs: {type: integer}
        response:
          type: [object, 'null']
          properties:
            status: {type: integer}
            body: {type: string}
            headers:
              type: array
              items: {$ref: '#/components/schemas/Pair'}
  securitySchemes:
    AdminKey:
      type: http
      scheme: bearer
      description: ADMIN_KEY grants full bootstrap access; administrator-provisioned hsu_ keys grant owner-scoped member access and expire in 30 days. Public receive tokens are never accepted. Authentication attempts share the management IP limiter.
  parameters:
    AnalyticsFrom:
      name: from
      in: query
      description: Inclusive ISO timestamp with timezone; defaults to 24 hours before to. Positive range at most 31 days.
      schema: {type: string, format: date-time}
    AnalyticsTo:
      name: to
      in: query
